<style>
:root{
  --olive:#9B8AFB; --olive-dark:#6D5BC4; --olive-soft:#ECE7FE;
  --bg:#F8F6FE; --card:#FFFFFF; --ink:#2E2A3E; --muted:#8D87A3;
  --gold:#B7A6F5; --gold-deep:#6D5BC4; --gold-soft:#EFEAFF; --border:#E2DAF7;
  --danger:#B4443C; --shadow:0 8px 24px rgba(109,91,196,.12);
  --shadow-lg:0 14px 34px rgba(109,91,196,.20);
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
::selection{background:var(--gold-soft);color:var(--olive-dark)}
button{transition:transform .12s ease,box-shadow .15s ease,filter .15s ease}
@media(hover:hover){.btn:hover{filter:brightness(1.06)}.opt:hover{border-color:var(--gold)}}
body{font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--ink);margin:0;line-height:1.9;padding-bottom:96px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg width='140' height='140' viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M70 18l9 18 20 3-14 14 3 20-18-10-18 10 3-20-14-14 20-3z' fill='none' stroke='%23B7A6F5' stroke-opacity='.12'/%3E%3C/svg%3E");}
.apphead{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--olive-dark),var(--olive) 65%,#7d9248);color:#fff;padding:.9rem 1rem;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);border-bottom:3px solid var(--gold)}
.logo{font-family:'Amiri',serif;font-size:1.7rem;font-weight:700}
.logo small{display:block;font-family:'Tajawal',sans-serif;font-size:.72rem;font-weight:400;opacity:.85}
.streak{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:.25rem .9rem;font-weight:800;font-size:.95rem;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:1rem;position:relative;z-index:1}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.2rem;margin:0 0 1rem;overflow:hidden;position:relative}
.view .card{animation:rise .38s ease backwards}
.view .card:nth-child(2){animation-delay:.06s}.view .card:nth-child(3){animation-delay:.12s}.view .card:nth-child(4){animation-delay:.18s}.view .card:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(hover:hover){.card:hover{box-shadow:var(--shadow-lg)}}
.card.gold{border-color:var(--gold);background:linear-gradient(180deg,#FFFDF4,#FFF9E8)}
.card h2{margin:0 0 .6rem;font-size:1.25rem;color:var(--olive-dark)}
.card h3{margin:0 0 .4rem}
.hero{text-align:center;background:linear-gradient(135deg,#3D3670,var(--olive-dark) 45%,var(--olive) 75%,#B7A6F5);color:#fff;border:1px solid var(--olive-dark);position:relative}
.hero::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.6;background-image:url("data:image/svg+xml,%3Csvg width='160' height='160' viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M80 22l11 22 24 4-17 17 4 24-22-12-22 12 4-24-17-17 24-4z' fill='none' stroke='%23ffffff' stroke-opacity='.14'/%3E%3C/svg%3E");}
.hero h1{font-family:'Amiri',serif;font-size:2.6rem;margin:.2rem 0;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.25);position:relative}
.hero h1::after{content:'✦ ───── ✦';display:block;font-size:.95rem;color:var(--gold-soft);letter-spacing:2px;margin-top:.15rem}
.hero p{margin:.2rem 0 0;opacity:.93;position:relative}
.hero .hadith{font-family:'Amiri',serif;font-size:1.02rem;color:var(--gold-soft);opacity:.9;margin-top:.35rem;position:relative}

َّهُۥ يَزَّكَّىٰٓ","أَوْ يَذَّكَّرُ فَتَنفَعَهُ ٱلذِّكْرَىٰٓ","أَمَّا مَنِ ٱسْتَغْنَىٰ","فَأَنتَ لَهُۥ تَصَدَّىٰ","وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ","وَأَمَّا مَن جَآءَكَ يَسْعَىٰ","وَهُوَ يَخْشَىٰ","فَأَنتَ عَنْهُ تَلَهَّىٰ","كَلَّآ إِنَّهَا تَذْكِرَةٌ","فَمَن شَآءَ ذَكَرَهُۥ","فِى صُحُفٍ مُّكَرَّمَةٍ","مَّرْفُوعَةٍ مُّطَهَّرَةٍۭ","بِأَيْدِى سَفَرَةٍ","كِرَامٍۭ بَرَرَةٍ","قُتِلَ ٱلْإِنسَـٰنُ مَآ أَكْفَرَهُۥ","مِنْ أَىِّ شَىْءٍ خَلَقَهُۥ","مِن نُّطْفَةٍ خَلَقَهُۥ فَقَدَّرَهُۥ","ثُمَّ ٱلسَّبِيلَ يَسَّرَهُۥ","ثُمَّ أَمَاتَهُۥ فَأَقْبَرَهُۥ","ثُمَّ إِذَا شَآءَ أَنشَرَهُۥ","كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ","فَلْيَنظُرِ ٱلْإِنسَـٰنُ إِلَىٰ طَعَامِهِۦٓ","أَنَّا صَبَبْنَا ٱلْمَآءَ صَبًّا","ثُمَّ شَقَقْنَا ٱلْأَرْضَ شَقًّا","فَأَنۢبَتْنَا فِيهَا حَبًّا","وَعِنَبًا وَقَضْبًا","وَزَيْتُونًا وَنَخْلًا","وَحَدَآئِقَ غُلْبًا","وَفَـٰكِهَةً وَأَبًّا","مَّتَـٰعًا لَّكُمْ وَلِأَنْعَـٰمِكُمْ","فَإِذَا جَآءَتِ ٱلصَّآخَّةُ","يَوْمَ يَفِرُّ ٱلْمَرْءُ مِنْ أَخِيهِ","وَأُمِّهِۦ وَأَبِيهِ","وَصَـٰحِبَتِهِۦ وَبَنِيهِ","لِكُلِّ ٱمْرِئٍ مِّنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ","وُجُوهٌ يَوْمَئِذٍ مُّسْفِرَةٌ","ضَاحِكَةٌ مُّسْتَبْشِرَةٌ","وَوُجُوهٌ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٌ","تَرْهَقُهَا قَتَرَةٌ","أُو۟لَـٰٓئِكَ هُمُ ٱلْكَفَرَةُ ٱلْفَجَرَةُ"]},"81":{"n":"التكوير","a":[" إِذَا ٱلشَّمْسُ كُوِّرَتْ","وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتْ","وَإِذَا ٱلْجِبَالُ سُيِّرَتْ","وَإِذَا ٱلْعِشَارُ عُطِّلَتْ","وَإِذَا ٱلْوُحُوشُ حُشِرَتْ","وَإِذَا ٱلْبِحَارُ سُجِّرَتْ","وَإِذَا ٱلنُّفُوسُ زُوِّجَتْ","وَإِذَا ٱلْمَوْءُۥدَةُ سُئِلَتْ","بِأَىِّ ذَنۢبٍ قُتِلَتْ","وَإِذَا ٱلصُّحُفُ نُشِرَتْ","وَإِذَا ٱلسَّمَآءُ كُشِطَتْ","وَإِذَا ٱلْجَحِيمُ سُعِّرَتْ","وَإِذَا ٱلْجَنَّةُ أُزْلِفَتْ","عَلِمَتْ نَفْسٌ مَّآ أَحْضَرَتْ","فَلَآ أُقْسِمُ بِٱلْخُنَّسِ","ٱلْجَوَارِ ٱلْكُنَّسِ","وَٱلَّيْلِ إِذَا عَسْعَسَ","وَٱلصُّبْحِ إِذَا تَنَفَّسَ","إِنَّهُۥ لَقَوْلُ رَسُولٍ كَرِيمٍ","ذِى قُوَّةٍ عِندَ ذِى ٱلْعَرْشِ مَكِينٍ","مُّطَاعٍ ثَمَّ أَمِينٍ","وَمَا صَاحِبُكُم بِمَجْنُونٍ","وَلَقَدْ رَءَاهُ بِٱلْأُفُقِ ٱلْمُبِينِ","وَمَا هُوَ عَلَى ٱلْغَيْبِ بِضَنِينٍ","وَمَا هُوَ بِقَوْلِ شَيْطَـٰنٍ رَّجِيمٍ","فَأَيْنَ تَذْهَبُونَ","إِنْ هُوَ إِلَّا ذِكْرٌ لِّلْعَـٰلَمِينَ","لِمَن شَآءَ مِنكُمْ أَن يَسْتَقِيمَ","وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّ ٱلْعَـٰلَمِينَ"]},"82":{"n":"الإنفطار","a":[" إِذَا ٱلسَّمَآءُ ٱنفَطَرَتْ","وَإِذَا ٱلْكَوَاكِبُ ٱنتَثَرَتْ","وَإِذَا ٱلْبِحَارُ فُجِّرَتْ","وَإِذَا ٱلْقُبُورُ بُعْثِرَتْ","عَلِمَتْ نَفْسٌ مَّا قَدَّمَتْ وَأَخَّرَتْ","يَـٰٓأَيُّهَا ٱلْإِنسَـٰنُ مَا غَرَّكَ بِرَبِّكَ ٱلْكَرِيمِ","ٱلَّذِى خَلَقَكَ فَسَوَّىٰكَ فَعَدَلَكَ","فِىٓ أَىِّ صُورَةٍ مَّا شَآءَ رَكَّبَكَ","كَلَّا بَلْ تُكَذِّبُونَ بِٱلدِّينِ","وَإِنَّ عَلَيْكُمْ لَحَـٰفِظِينَ","كِرَامًا كَـٰتِبِينَ","يَعْلَمُونَ مَا تَفْعَلُونَ","إِنَّ ٱلْأَبْرَارَ لَفِى نَعِيمٍ","وَإِنَّ ٱلْفُجَّارَ لَفِى جَحِيمٍ","يَصْلَوْنَهَا يَوْمَ ٱلدِّينِ","وَمَا هُمْ عَنْهَا بِغَآئِبِينَ","وَمَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ","ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ","يَوْمَ لَا تَمْلِكُ نَفْسٌ لِّنَفْسٍ شَيْـًٔا ۖ وَٱلْأَمْرُ يَوْمَئِذٍ لِّلَّهِ"]},"83":{"n":"المطففين","a":[" وَيْلٌ لِّلْمُطَفِّفِينَ","ٱلَّذِينَ إِذَا ٱكْتَالُوا۟ عَلَى ٱلنَّاسِ يَسْتَوْفُونَ","وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ","أَلَا يَظُنُّ أُو۟لَـٰٓئِكَ أَنَّهُم مَّبْعُوثُونَ","لِيَوْمٍ عَظِيمٍ","يَوْمَ يَقُومُ ٱلنَّاسُ لِرَبِّ ٱلْعَـٰلَمِينَ","كَلَّآ إِنَّ كِتَـٰبَ ٱلْفُجَّارِ لَفِى سِجِّينٍ","وَمَآ أَدْرَىٰكَ مَا سِجِّينٌ","كِتَـٰبٌ مَّرْقُومٌ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","ٱلَّذِينَ يُكَذِّبُونَ بِيَوْمِ ٱلدِّينِ","وَمَا يُكَذِّبُ بِهِۦٓ إِلَّا كُلُّ مُعْتَدٍ أَثِيمٍ","إِذَا تُتْلَىٰ عَلَيْهِ ءَايَـٰتُنَا قَالَ أَسَـٰطِيرُ ٱلْأَوَّلِينَ","كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ","كَلَّآ إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍ لَّمَحْجُوبُونَ","ثُمَّ إِنَّهُمْ لَصَالُوا۟ ٱلْجَحِيمِ","ثُمَّ يُقَالُ هَـٰذَا ٱلَّذِى كُنتُم بِهِۦ تُكَذِّبُونَ","كَلَّآ إِنَّ كِتَـٰبَ ٱلْأَبْرَارِ لَفِى عِلِّيِّينَ","وَمَآ أَدْرَىٰكَ مَا عِلِّيُّونَ","كِتَـٰبٌ مَّرْقُومٌ","يَشْهَدُهُ ٱلْمُقَرَّبُونَ","إِنَّ ٱلْأَبْرَارَ لَفِى نَعِيمٍ","عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ","تَعْرِفُ فِى وُجُوهِهِمْ نَضْرَةَ ٱلنَّعِيمِ","يُسْقَوْنَ مِن رَّحِيقٍ مَّخْتُومٍ","خِتَـٰمُهُۥ مِسْكٌ ۚ وَفِى ذَٰلِكَ فَلْيَتَنَافَسِ ٱلْمُتَنَـٰفِسُونَ","وَمِزَاجُهُۥ مِن تَسْنِيمٍ","عَيْنًا يَشْرَبُ بِهَا ٱلْمُقَرَّبُونَ","إِنَّ ٱلَّذِينَ أَجْرَمُوا۟ كَانُوا۟ مِنَ ٱلَّذِينَ ءَامَنُوا۟ يَضْحَكُونَ","وَإِذَا مَرُّوا۟ بِهِمْ يَتَغَامَزُونَ","وَإِذَا ٱنقَلَبُوٓا۟ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُوا۟ فَكِهِينَ","وَإِذَا رَأَوْهُمْ قَالُوٓا۟ إِنَّ هَـٰٓؤُلَآءِ لَضَآلُّونَ","وَمَآ أُرْسِلُوا۟ عَلَيْهِمْ حَـٰفِظِينَ","فَٱلْيَوْمَ ٱلَّذِينَ ءَامَنُوا۟ مِنَ ٱلْكُفَّارِ يَضْحَكُونَ","عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ","هَلْ ثُوِّبَ ٱلْكُفَّارُ مَا كَانُوا۟ يَفْعَلُونَ"]},"84":{"n":"الإنشقاق","a":[" إِذَا ٱلسَّمَآءُ ٱنشَقَّتْ","وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","وَإِذَا ٱلْأَرْضُ مُدَّتْ","وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ","وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","يَـٰٓأَيُّهَا ٱلْإِنسَـٰنُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدْحًا فَمُلَـٰقِيهِ","فَأَمَّا مَنْ أُوتِىَ كِتَـٰبَهُۥ بِيَمِينِهِۦ","فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا","وَيَنقَلِبُ إِلَىٰٓ أَهْلِهِۦ مَسْرُورًا","وَأَمَّا مَنْ أُوتِىَ كِتَـٰبَهُۥ وَرَآءَ ظَهْرِهِۦ","فَسَوْفَ يَدْعُوا۟ ثُبُورًا","وَيَصْلَىٰ سَعِيرًا","إِنَّهُۥ كَانَ فِىٓ أَهْلِهِۦ مَسْرُورًا","إِنَّهُۥ ظَنَّ أَن لَّن يَحُورَ","بَلَىٰٓ إِنَّ رَبَّهُۥ كَانَ بِهِۦ بَصِيرًا","فَلَآ أُقْسِمُ بِٱلشَّفَقِ","وَٱلَّيْلِ وَمَا وَسَقَ","وَٱلْقَمَرِ إِذَا ٱتَّسَقَ","لَتَرْكَبُنَّ طَبَقًا عَن طَبَقٍ","فَمَا لَهُمْ لَا يُؤْمِنُونَ","وَإِذَا قُرِئَ عَلَيْهِمُ ٱلْقُرْءَانُ لَا يَسْجُدُونَ ۩","بَلِ ٱلَّذِينَ كَفَرُوا۟ يُكَذِّبُونَ","وَٱللَّهُ أَعْلَمُ بِمَا يُوعُونَ","فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ","إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۭ"]},"85":{"n":"البروج","a":[" وَٱلسَّمَآءِ ذَاتِ ٱلْبُرُوجِ","وَٱلْيَوْمِ ٱلْمَوْعُودِ","وَشَاهِدٍ وَمَشْهُودٍ","قُتِلَ أَصْحَـٰبُ ٱلْأُخْدُودِ","ٱلنَّارِ ذَاتِ ٱلْوَقُودِ","إِذْ هُمْ عَلَيْهَا قُعُودٌ","وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌ","وَمَا نَقَمُوا۟ مِنْهُمْ إِلَّآ أَن يُؤْمِنُوا۟ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ","ٱلَّذِى لَهُۥ مُلْكُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍ شَهِيدٌ","إِنَّ ٱلَّذِينَ فَتَنُوا۟ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَـٰتِ ثُمَّ لَمْ يَتُوبُوا۟ فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ ٱلْحَرِيقِ","إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ لَهُمْ جَنَّـٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ ۚ ذَٰلِكَ ٱلْفَوْزُ ٱلْكَبِيرُ","إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ","إِنَّهُۥ هُوَ يُبْدِئُ وَيُعِيدُ","وَهُوَ ٱلْغَفُورُ ٱلْوَدُودُ","ذُو ٱلْعَرْشِ ٱلْمَجِيدُ","فَعَّالٌ لِّمَا يُرِيدُ","هَلْ أَتَىٰكَ حَدِيثُ ٱلْجُنُودِ","فِرْعَوْنَ وَثَمُودَ","بَلِ ٱلَّذِينَ كَفَرُوا۟ فِى تَكْذِيبٍ","وَٱللَّهُ مِن وَرَآئِهِم مُّحِيطٌۢ","بَلْ هُوَ قُرْءَانٌ مَّجِيدٌ","فِى لَوْحٍ مَّحْفُوظٍۭ"]},"86":{"n":"الطارق","a":[" وَٱلسَّمَآءِ وَٱلطَّارِقِ","وَمَآ أَدْرَىٰكَ مَا ٱلطَّارِقُ","ٱلنَّجْمُ ٱلثَّاقِبُ","إِن كُلُّ نَفْسٍ لَّمَّا عَلَيْهَا حَافِظٌ","فَلْيَنظُرِ ٱلْإِنسَـٰنُ مِمَّ خُلِقَ","خُلِقَ مِن مَّآءٍ دَافِقٍ","يَخْرُجُ مِنۢ بَيْنِ ٱلصُّلْبِ وَٱلتَّرَآئِبِ","إِنَّهُۥ عَلَىٰ رَجْعِهِۦ لَقَادِرٌ","يَوْمَ تُبْلَى ٱلسَّرَآئِرُ","فَمَا لَهُۥ مِن قُوَّةٍ وَلَا نَاصِرٍ","وَٱلسَّمَآءِ ذَاتِ ٱلرَّجْعِ","وَٱلْأَرْضِ ذَاتِ ٱلصَّدْعِ","إِنَّهُۥ لَقَوْلٌ فَصْلٌ","وَمَا هُوَ بِٱلْهَزْلِ","إِنَّهُمْ يَكِيدُونَ كَيْدًا","وَأَكِيدُ كَيْدًا","فَمَهِّلِ ٱلْكَـٰفِرِينَ أَمْهِلْهُمْ رُوَيْدًۢا"]},"87":{"n":"الأعلى","a":[" سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى","ٱلَّذِى خَلَقَ فَسَوَّىٰ","وَٱلَّذِى قَدَّرَ فَهَدَىٰ","وَٱلَّذِىٓ أَخْرَجَ ٱلْمَرْعَىٰ","فَجَعَلَهُۥ غُثَآءً أَحْوَىٰ","سَنُقْرِئُكَ فَلَا تَنسَىٰٓ","إِلَّا مَا شَآءَ ٱللَّهُ ۚ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ","وَنُيَسِّرُكَ لِلْيُسْرَىٰ","فَذَكِّرْ إِن نَّفَعَتِ ٱلذِّكْرَىٰ","سَيَذَّكَّرُ مَن يَخْشَىٰ","وَيَتَجَنَّبُهَا ٱلْأَشْقَى","ٱلَّذِى يَصْلَى ٱلنَّارَ ٱلْكُبْرَىٰ","ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ","قَدْ أَفْلَحَ مَن تَزَكَّىٰ","وَذَكَرَ ٱسْمَ رَبِّهِۦ فَصَلَّىٰ","بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا","وَٱلْـَٔاخِرَةُ خَيْرٌ وَأَبْقَىٰٓ","إِنَّ هَـٰذَا لَفِى ٱلصُّحُفِ ٱلْأُولَىٰ","صُحُفِ إِبْرَٰهِيمَ وَمُوسَىٰ"]},"88":{"n":"الغاشية","a":[" هَلْ أَتَىٰكَ حَدِيثُ ٱلْغَـٰشِيَةِ","وُجُوهٌ يَوْمَئِذٍ خَـٰشِعَةٌ","عَامِلَةٌ نَّاصِبَةٌ","تَصْلَىٰ نَارًا حَامِيَةً","تُسْقَىٰ مِنْ عَيْنٍ ءَانِيَةٍ","لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍ","لَّا يُسْمِنُ وَلَا يُغْنِى مِن جُوعٍ","وُجُوهٌ يَوْمَئِذٍ نَّاعِمَةٌ","لِّسَعْيِهَا رَاضِيَةٌ","فِى جَنَّةٍ عَالِيَةٍ","لَّا تَسْمَعُ فِيهَا لَـٰغِيَةً","فِيهَا عَيْنٌ جَارِيَةٌ","فِيهَا سُرُرٌ مَّرْفُوعَةٌ","وَأَكْوَابٌ مَّوْضُوعَةٌ","وَنَمَارِقُ مَصْفُوفَةٌ","وَزَرَابِىُّ مَبْثُوثَةٌ","أَفَلَا يَنظُرُونَ إِلَى ٱلْإِبِلِ كَيْفَ خُلِقَتْ","وَإِلَى ٱلسَّمَآءِ كَيْفَ رُفِعَتْ","وَإِلَى ٱلْجِبَالِ كَيْفَ نُصِبَتْ","وَإِلَى ٱلْأَرْضِ كَيْفَ سُطِحَتْ","فَذَكِّرْ إِنَّمَآ أَنتَ مُذَكِّرٌ","لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ","إِلَّا مَن تَوَلَّىٰ وَكَفَرَ","فَيُعَذِّبُهُ ٱللَّهُ ٱلْعَذَابَ ٱلْأَكْبَرَ","إِنَّ إِلَيْنَآ إِيَابَهُمْ","ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم"]},"89":{"n":"الفجر","a":[" وَٱلْفَجْرِ","وَلَيَالٍ عَشْرٍ","وَٱلشَّفْعِ وَٱلْوَتْرِ","وَٱلَّيْلِ إِذَا يَسْرِ","هَلْ فِى ذَٰلِكَ قَسَمٌ لِّذِى حِجْرٍ","أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ","إِرَمَ ذَاتِ ٱلْعِمَادِ","ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَـٰدِ","وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ","وَفِرْعَوْنَ ذِى ٱلْأَوْتَادِ","ٱلَّذِينَ طَغَوْا۟ فِى ٱلْبِلَـٰدِ","فَأَكْثَرُوا۟ فِيهَا ٱلْفَسَادَ","فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ","إِنَّ رَبَّكَ لَبِٱلْمِرْصَادِ","فَأَمَّا ٱلْإِنسَـٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ","وَأَمَّآ إِذَا مَا ٱبْتَلَىٰهُ فَقَدَرَ عَلَيْهِ رِزْقَهُۥ فَيَقُولُ رَبِّىٓ أَهَـٰنَنِ","كَلَّا ۖ بَل لَّا تُكْرِمُونَ ٱلْيَتِيمَ","وَلَا تَحَـٰٓضُّونَ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ","وَتَأْكُلُونَ ٱلتُّرَاثَ أَكْلًا لَّمًّا","وَتُحِبُّونَ ٱلْمَالَ حُبًّا جَمًّا","كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّا دَكًّا","وَجَآءَ رَبُّكَ وَٱلْمَلَكُ صَفًّا صَفًّا","وَجِا۟ىٓءَ يَوْمَئِذٍۭ بِجَهَنَّمَ ۚ يَوْمَئِذٍ يَتَذَكَّرُ ٱلْإِنسَـٰنُ وَأَنَّىٰ لَهُ ٱلذِّكْرَىٰ","يَقُولُ يَـٰلَيْتَنِى قَدَّمْتُ لِحَيَاتِى","فَيَوْمَئِذٍ لَّا يُعَذِّبُ عَذَابَهُۥٓ أَحَدٌ","وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٌ","يَـٰٓأَيَّتُهَا ٱلنَّفْسُ ٱلْمُطْمَئِنَّةُ","ٱرْجِعِىٓ إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً","فَٱدْخُلِى فِى عِبَـٰدِى","وَٱدْخُلِى جَنَّتِى"]},"90":{"n":"البلد","a":[" لَآ أُقْسِمُ بِهَـٰذَا ٱلْبَلَدِ","وَأَنتَ حِلٌّۢ بِهَـٰذَا ٱلْبَلَدِ","وَوَالِدٍ وَمَا وَلَدَ","لَقَدْ خَلَقْنَا ٱلْإِنسَـٰنَ فِى كَبَدٍ","أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ أَحَدٌ","يَقُولُ أَهْلَكْتُ مَالًا لُّبَدًا","أَيَحْسَبُ أَن لَّمْ يَرَهُۥٓ أَحَدٌ","أَلَمْ نَجْعَل لَّهُۥ عَيْنَيْنِ","وَلِسَانًا وَشَفَتَيْنِ","وَهَدَيْنَـٰهُ ٱلنَّجْدَيْنِ","فَلَا ٱقْتَحَمَ ٱلْعَقَبَةَ","وَمَآ أَدْرَىٰكَ مَا ٱلْعَقَبَةُ","فَكُّ رَقَبَةٍ","أَوْ إِطْعَـٰمٌ فِى يَوْمٍ ذِى مَسْغَبَةٍ","يَتِيمًا ذَا مَقْرَبَةٍ","أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ","ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُوا۟ وَتَوَاصَوْا۟ بِٱلصَّبْرِ وَتَوَاصَوْا۟ بِٱلْمَرْحَمَةِ","أُو۟لَـٰٓئِكَ أَصْحَـٰبُ ٱلْمَيْمَنَةِ","وَٱلَّذِينَ كَفَرُوا۟ بِـَٔايَـٰتِنَا هُمْ أَصْحَـٰبُ ٱلْمَشْـَٔمَةِ","عَلَيْهِمْ نَارٌ مُّؤْصَدَةٌۢ"]},"91":{"n":"الشمس","a":[" وَٱلشَّمْسِ وَضُحَىٰهَا","وَٱلْقَمَرِ إِذَا تَلَىٰهَا","وَٱلنَّهَارِ إِذَا جَلَّىٰهَا","وَٱلَّيْلِ إِذَا يَغْشَىٰهَا","وَٱلسَّمَآءِ وَمَا بَنَىٰهَا","وَٱلْأَرْضِ وَمَا طَحَىٰهَا","وَنَفْسٍ وَمَا سَوَّىٰهَا","فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَىٰهَا","قَدْ أَفْلَحَ مَن زَكَّىٰهَا","وَقَدْ خَابَ مَن دَسَّىٰهَا","كَذَّبَتْ ثَمُودُ بِطَغْوَىٰهَآ","إِذِ ٱنۢبَعَثَ أَشْقَىٰهَا","فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَـٰهَا","فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا","وَلَا يَخَافُ عُقْبَـٰهَا"]},"92":{"n":"الليل","a":[" وَٱلَّيْلِ إِذَا يَغْشَىٰ","وَٱلنَّهَارِ إِذَا تَجَلَّىٰ","وَمَا خَلَقَ ٱلذَّكَرَ وَٱلْأُنثَىٰٓ","إِنَّ سَعْيَكُمْ لَشَتَّىٰ","فَأَمَّا مَنْ أَعْطَىٰ وَٱتَّقَىٰ","وَصَدَّقَ بِٱلْحُسْنَىٰ","فَسَنُيَسِّرُهُۥ لِلْيُسْرَىٰ","وَأَمَّا مَنۢ بَخِلَ وَٱسْتَغْنَىٰ","وَكَذَّبَ بِٱلْحُسْنَىٰ","فَسَنُيَسِّرُهُۥ لِلْعُسْرَىٰ","وَمَا يُغْنِى عَنْهُ مَالُهُۥٓ إِذَا تَرَدَّىٰٓ","إِنَّ عَلَيْنَا لَلْهُدَىٰ","وَإِنَّ لَنَا لَلْـَٔاخِرَةَ وَٱلْأُولَىٰ","فَأَنذَرْتُكُمْ نَارًا تَلَظَّىٰ","لَا يَصْلَىٰهَآ إِلَّا ٱلْأَشْقَى","ٱلَّذِى كَذَّبَ وَتَوَلَّىٰ","وَسَيُجَنَّبُهَا ٱلْأَتْقَى","ٱلَّذِى يُؤْتِى مَالَهُۥ يَتَزَكَّىٰ","وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعْمَةٍ تُجْزَىٰٓ","إِلَّا ٱبْتِغَآءَ وَجْهِ رَبِّهِ ٱلْأَعْلَىٰ","وَلَسَوْفَ يَرْضَىٰ"]},"93":{"n":"الضحى","a":[" وَٱلضُّحَىٰ","وَٱلَّيْلِ إِذَا سَجَىٰ","مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","وَلَلْـَٔاخِرَةُ خَيْرٌ لَّكَ مِنَ ٱلْأُولَىٰ","وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰٓ","أَلَمْ يَجِدْكَ يَتِيمًا فَـَٔاوَىٰ","وَوَجَدَكَ ضَآلًّا فَهَدَىٰ","وَوَجَدَكَ عَآئِلًا فَأَغْنَىٰ","فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ","وَأَمَّا ٱلسَّآئِلَ فَلَا تَنْهَرْ","وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ"]},"94":{"n":"الشرح","a":[" أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","وَوَضَعْنَا عَنكَ وِزْرَكَ","ٱلَّذِىٓ أَنقَضَ ظَهْرَكَ","وَرَفَعْنَا لَكَ ذِكْرَكَ","فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","فَإِذَا فَرَغْتَ فَٱنصَبْ","وَإِلَىٰ رَبِّكَ فَٱرْغَب"]},"95":{"n":"التين","a":["وَٱلتِّينِ وَٱلزَّيْتُونِ","وَطُورِ سِينِينَ","وَهَـٰذَا ٱلْبَلَدِ ٱلْأَمِينِ","لَقَدْ خَلَقْنَا ٱلْإِنسَـٰنَ فِىٓ أَحْسَنِ تَقْوِيمٍ","ثُمَّ رَدَدْنَـٰهُ أَسْفَلَ سَـٰفِلِينَ","إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ","فَمَا يُكَذِّبُكَ بَعْدُ بِٱلدِّينِ","أَلَيْسَ ٱللَّهُ بِأَحْكَمِ ٱلْحَـٰكِمِينَ"]},"96":{"n":"العلق","a":[" ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ","خَلَقَ ٱلْإِنسَـٰنَ مِنْ عَلَقٍ","ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ","ٱلَّذِى عَلَّمَ بِٱلْقَلَمِ","عَلَّمَ ٱلْإِنسَـٰنَ مَا لَمْ يَعْلَمْ","كَلَّآ إِنَّ ٱلْإِنسَـٰنَ لَيَطْغَىٰٓ","أَن رَّءَاهُ ٱسْتَغْنَىٰٓ","إِنَّ إِلَىٰ رَبِّكَ ٱلرُّجْعَىٰٓ","أَرَءَيْتَ ٱلَّذِى يَنْهَىٰ","عَبْدًا إِذَا صَلَّىٰٓ","أَرَءَيْتَ إِن كَانَ عَلَى ٱلْهُدَىٰٓ","أَوْ أَمَرَ بِٱلتَّقْوَىٰٓ","أَرَءَيْتَ إِن كَذَّبَ وَتَوَلَّىٰٓ","أَلَمْ يَعْلَم بِأَنَّ ٱللَّهَ يَرَىٰ","كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًۢا بِٱلنَّاصِيَةِ","نَاصِيَةٍ كَـٰذِبَةٍ خَاطِئَةٍ","فَلْيَدْعُ نَادِيَهُۥ","سَنَدْعُ ٱلزَّبَانِيَةَ","كَلَّا لَا تُطِعْهُ وَٱسْجُدْ وَٱقْتَرِب ۩"]},"97":{"n":"القدر","a":["إِنَّآ أَنزَلْنَـٰهُ فِى لَيْلَةِ ٱلْقَدْرِ","وَمَآ أَدْرَىٰكَ مَا لَيْلَةُ ٱلْقَدْرِ","لَيْلَةُ ٱلْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ","تَنَزَّلُ ٱلْمَلَـٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ","سَلَـٰمٌ هِىَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ"]},"98":{"n":"البينة","a":[" لَمْ يَكُنِ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَـٰبِ وَٱلْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ ٱلْبَيِّنَةُ","رَسُولٌ مِّنَ ٱللَّهِ يَتْلُوا۟ صُحُفًا مُّطَهَّرَةً","فِيهَا كُتُبٌ قَيِّمَةٌ","وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَـٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَةُ","وَمَآ أُمِرُوٓا۟ إِلَّا لِيَعْبُدُوا۟ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُوا۟ ٱلصَّلَوٰةَ وَيُؤْتُوا۟ ٱلزَّكَوٰةَ ۚ وَذَٰلِكَ دِينُ ٱلْقَيِّمَةِ","إِنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَـٰبِ وَٱلْمُشْرِكِينَ فِى نَارِ جَهَنَّمَ خَـٰلِدِينَ فِيهَآ ۚ أُو۟لَـٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ","إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ أُو۟لَـٰٓئِكَ هُمْ خَيْرُ ٱلْبَرِيَّةِ","جَزَآؤُهُمْ عِندَ رَبِّهِمْ جَنَّـٰتُ عَدْنٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَآ أَبَدًا ۖ رَّضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ ۚ ذَٰلِكَ لِمَنْ خَشِىَ رَبَّهُۥ"]},"99":{"n":"الزلزلة","a":[" إِذَا زُلْزِلَتِ ٱلْأَرْضُ زِلْزَالَهَا","وَأَخْرَجَتِ ٱلْأَرْضُ أَثْقَالَهَا","وَقَالَ ٱلْإِنسَـٰنُ مَا لَهَا","يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","يَوْمَئِذٍ يَصْدُرُ ٱلنَّاسُ أَشْتَاتًا لِّيُرَوْا۟ أَعْمَـٰلَهُمْ","فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُۥ","وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُۥ"]},"100":{"n":"العاديات","a":[" وَٱلْعَـٰدِيَـٰتِ ضَبْحًا","فَٱلْمُورِيَـٰتِ قَدْحًا","فَٱلْمُغِيرَٰتِ صُبْحًا","فَأَثَرْنَ بِهِۦ نَقْعًا","فَوَسَطْنَ بِهِۦ جَمْعًا","إِنَّ ٱلْإِنسَـٰنَ لِرَبِّهِۦ لَكَنُودٌ","وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ","وَإِنَّهُۥ لِحُبِّ ٱلْخَيْرِ لَشَدِيدٌ","۞ أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِى ٱلْقُبُورِ","وَحُصِّلَ مَا فِى ٱلصُّدُورِ","إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌۢ"]},"101":{"n":"القارعة","a":[" ٱلْقَارِعَةُ","مَا ٱلْقَارِعَةُ","وَمَآ أَدْرَىٰكَ مَا ٱلْقَارِعَةُ","يَوْمَ يَكُونُ ٱلنَّاسُ كَٱلْفَرَاشِ ٱلْمَبْثُوثِ","وَتَكُونُ ٱلْجِبَالُ كَٱلْعِهْنِ ٱلْمَنفُوشِ","فَأَمَّا مَن ثَقُلَتْ مَوَٰزِينُهُۥ","فَهُوَ فِى عِيشَةٍ رَّاضِيَةٍ","وَأَمَّا مَنْ خَفَّتْ مَوَٰزِينُهُۥ","فَأُمُّهُۥ هَاوِيَةٌ","وَمَآ أَدْرَىٰكَ مَا هِيَهْ","نَارٌ حَامِيَةٌۢ"]},"102":{"n":"التكاثر","a":[" أَلْهَىٰكُمُ ٱلتَّكَاثُرُ","حَتَّىٰ زُرْتُمُ ٱلْمَقَابِرَ","كَلَّا سَوْفَ تَعْلَمُونَ","ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ","كَلَّا لَوْ تَعْلَمُونَ عِلْمَ ٱلْيَقِينِ","لَتَرَوُنَّ ٱلْجَحِيمَ","ثُمَّ لَتَرَوُنَّهَا عَيْنَ ٱلْيَقِينِ","ثُمَّ لَتُسْـَٔلُنَّ يَوْمَئِذٍ عَنِ ٱلنَّعِيمِ"]},"103":{"n":"العصر","a":[" وَٱلْعَصْرِ","إِنَّ ٱلْإِنسَـٰنَ لَفِى خُسْرٍ","إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّـٰلِحَـٰتِ وَتَوَاصَوْا۟ بِٱلْحَقِّ وَتَوَاصَوْا۟ بِٱلصَّبْرِ"]},"104":{"n":"الهمزة","a":[" وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ","ٱلَّذِى جَمَعَ مَالًا وَعَدَّدَهُۥ","يَحْسَبُ أَنَّ مَالَهُۥٓ أَخْلَدَهُۥ","كَلَّا ۖ لَيُنۢبَذَنَّ فِى ٱلْحُطَمَةِ","وَمَآ أَدْرَىٰكَ مَا ٱلْحُطَمَةُ","نَارُ ٱللَّهِ ٱلْمُوقَدَةُ","ٱلَّتِى تَطَّلِعُ عَلَى ٱلْأَفْـِٔدَةِ","إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ","فِى عَمَدٍ مُّمَدَّدَةٍۭ"]},"105":{"n":"الفيل","a":[" أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَـٰبِ ٱلْفِيلِ","أَلَمْ يَجْعَلْ كَيْدَهُمْ فِى تَضْلِيلٍ","وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ","تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ","فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍۭ"]},"106":{"n":"قريش","a":[" لِإِيلَـٰفِ قُرَيْشٍ","إِۦلَـٰفِهِمْ رِحْلَةَ ٱلشِّتَآءِ وَٱلصَّيْفِ","فَلْيَعْبُدُوا۟ رَبَّ هَـٰذَا ٱلْبَيْتِ","ٱلَّذِىٓ أَطْعَمَهُم مِّن جُوعٍ وَءَامَنَهُم مِّنْ خَوْفٍۭ"]},"107":{"n":"الماعون","a":[" أ   [1,2,3,4,5,6,7].forEach(function(a){M(1,a);});
  [1,2,3,4].forEach(function(a){M(112,a);});
  [1,2,3,4,5].forEach(function(a){M(113,a);});
  [1,2,3,4,5,6].forEach(function(a){M(114,a);});
  [1,2,3].forEach(function(a){M(108,a);});
  [1,2,3].forEach(function(a){M(103,a);});
  st.rev=[
    {k:"105:3",added:todayStr(0),due:todayStr(0),fails:0},
    {k:"94:6",added:todayStr(-3),due:todayStr(-3),fails:2},
    {k:"93:4",added:todayStr(-10),due:todayStr(-10),fails:1},
    {k:"96:3",added:todayStr(-1),due:todayStr(3),fails:0}

function key(s,a){return s+":"+a;}

function corpusPct(){return Math.round(memCount()/TOTAL_AYAT*1000)/10;}
function streak(){var v=S.visits.slice().sort();var c=0,d=todayStr(0);if(v.indexOf(d)<0){d=todayStr(-1);}while(v.indexOf(d)>=0){c++;var p=d.split("-");var dt=new Date(+p[0],+p[1]-1,+p[2]);dt.setDate(dt.getDate()-1);var m=dt.getMonth()+1,dd=dt.getDate();d=dt.getFullYear()+"-"+(m<10?"0"+m:m)+"-"+(dd<10?"0"+dd:dd);}return c;}

  var h='<div class="card hero"><h1>رفيق الحفظ</h1><p>خطوة كل يوم… حتى يتم الحفظ</p><div class="hadith">«خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ» — متفق عليه</div></div>';
  h+='<div class="card"><h2>📊 تقدمك</h2><div class="stats3"><div class="stat"><b>'+pct+'%</b><span>نسبة الإنجاز</span></div><div class="stat"><b>'+done.length+'</b><span>سور محفوظة</span></div><div class="stat"><b>'+mc+'</b><span>آية محفوظة</span></div></div><div class="pbar"><div style="width:'+pct+'%"></div></div></div>';
  h+='<div class="card gold"><h2>🎯 هدف اليوم: '+S.goal+' آيات</h2><div class="muted">حفظت اليوم: <b>'+td+'</b> • متبقي: <b>'+left+'</b></div><div class="pbar"><div style="width:'+gpct+'%"></div></div><div class="row"><button class="btn btn-primary" onclick="App.go(\'hifz\')">ابدأ الحفظ 📖</button></div><div class="row"><button class="btn btn-gold" onclick="App.go(\'quiz\')">اختبر حفظي 🧠</button><button class="btn btn-ghost" onclick="App.go(\'review\')">مراجعتي 🔄</button></div></div>';
  h+='<div class="card center"><h2>🔥 سلسلة الحفظ: '+st+' أيام متتالية</h2><div class="muted">'+(st>0?"واصل! كل يوم يقربك من الختمة.":"ابدأ اليوم وسجّل أول يوم في سلسلتك.")+'</div><div class="row"><button class="btn btn-ghost" onclick="App.go(\'plan\')">خطتي 🗓️</button><button class="btn btn-ghost" onclick="App.go(\'achv\')">إنجازاتي 🏆</button></div></div>';
  return h;
}
/* ---------- HIFZ ---------- */
var H={s:null,from:1,to:5,hide:{}};
App.pickSurah=function(){var s=+document.getElementById("hsurah").value;var un=nextUnmem(s,5);H.s=s;H.from=un.length?un[0]:1;H.to=Math.min(QURAN[s].a.length,H.from+(un.length?Math.min(4,un.length-1):0));H.hide={};render();var f=document.getElementById("hfrom");if(f){f.value=H.from;document.getElementById("hto").value=H.to;}};
App.showRange=function(){var s=+document.getElementById("hsurah").value;var f=Math.max(1,+document.getElementById("hfrom").value||1);var t=Math.min(QURAN[s].a.length,+document.getElementById("hto").value||f);if(t<f){var x=f;f=t;t=x;}if(t-f>9){t=f+9;}H.s=s;H.from=f;H.to=t;H.hide={};render();};
App.toggleHide=function(s,a){var k=key(s,a);H.hide[k]=!H.hide[k];var el=document.getElementById("ay"+s+"_"+a);if(el){el.classList.toggle("hidden-ayah",!!H.hide[k]);var b=document.getElementById("hb"+s+"_"+a);if(b)b.textContent=H.hide[k]?"إظهار الآية 👁️":"إخفاء الآية 🙈";}};
App.markMem=function(s,a){var k=key(s,a);if(!S.mem[k]){S.mem[k]=1;var t=todayStr(0);S.memLog[t]=(S.memLog[t]||0)+1;}save();render();};
App.markRev=function(s,a){var k=key(s,a);if(!S.rev.some(function(r){return r.k===k;})){S.rev.push({k:k,added:todayStr(0),due:todayStr(0),fails:0});}save();render();};
function vHifz(){
  if(H.s==null){var ns=firstUnmemSurah();var un=nextUnmem(ns,5);H.s=pendingRange?pendingRange.s:ns;H.from=pendingRange?pendingRange.from:(un.length?un[0]:1);H.to=pendingRange?pendingRange.to:(un.length?un[un.length-1]:H.from);pendingRange=null;}
  var h='<div class="card"><h2>📖 اختر ما تريد حفظه</h2><label>السورة</label><select id="hsurah" onchange="App.pickSurah()">';
  ORDER.forEach(function(n){var tot=QURAN[n].a.length,c=0;for(var i=1;i<=tot;i++)if(isMem(n,i))c++;var doneMark=c===tot?" ✓":" ("+c+"/"+tot+")";h+='<option value="'+n+'"'+(n===H.s?" selected":"")+'>'+n+". "+sName(n)+doneMark+'</option>';});
  h+='</select><div class="row"><div style="flex:1"><label>من آية</label><input type="number" id="hfrom" min="1" value="'+H.from+'"></div><div style="flex:1"><label>إلى آية</label><input type="number" id="hto" min="1" value="'+H.to+'"></div></div><button class="btn btn-primary" onclick="App.showRange()">عرض الآيات 👀</button></div>';
  h+='<div class="card"><h2>'+sName(H.s)+'</h2>';
  if(H.s!==1)h+='<div class="basmala">'+BASMALA+'</div>';
  for(var a=H.from;a<=H.to;a++){
    var k=key(H.s,a),hid=H.hide[k],mem=isMem(H.s,a);
    h+='<div class="ayah'+(hid?" hidden-ayah":"")+(mem?" done":"")+'" id="ay'+H.s+"_"+a+'"><span class="txt">'+ayahText(H.s,a)+'</span> <span class="ref">'+a+(mem?" ✓":"")+'</span><div class="abtns"><button id="hb'+H.s+"_"+a+'" onclick="App.toggleHide('+H.s+","+a+')">'+(hid?"إظهار الآية 👁️":"إخفاء الآية 🙈")+'</button><button class="ok" onclick="App.markMem('+H.s+","+a+')">'+(mem?"محفوظة ✓":"حفظتها ✓")+'</button><button class="rev" onclick="App.markRev('+H.s+","+a+')">أحتاج مراجعة 🔄</button></div></div>';
  }
  h+='</div>';
  return h;
}
/* ---------- QUIZ ---------- */
var Q=null;
function memKeys(){return Object.keys(S.mem);}
function keyParts(k){var p=k.split(":");return[+p[0],+p[1]];}
function poolKeys(){var mk=memKeys();if(mk.length>=5)return mk;var all=[];ORDER.forEach(function(n){var A=QURAN[n].a;for(var i=0;i<A.length;i++)all.push(n+":"+(i+1));});return all;}
function W(t){return t.split(/\s+/);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rnd(arr){return arr[Math.floor(Math.random()*arr.length)];}
function mkComplete(pool){for(var t=0;t<40;t++){var k=rnd(pool),p=keyParts(k),w=W(ayahText(p[0],p[1]));if(w.length<4)continue;var cut=Math.max(2,Math.floor(w.length/2));var opts=[w.slice(cut).join(" ")];var seen={};seen[opts[0]]=1;var guard=0;while(opts.length<3&&guard++<60){var k2=rnd(pool);if(k2===k)continue;var p2=keyParts(k2),w2=W(ayahText(p2[0],p2[1]));if(w2.length<=cut)continue;var o=w2.slice(cut).join(" ");if(!seen[o]){seen[o]=1;opts.push(o);}}if(opts.length<3)continue;return{type:"c",s:p[0],a:p[1],prompt:w.slice(0,cut).join(" "),opts:shuffle(opts),ans:w.slice(cut).join(" ")};}return null;}
function mkNext(pool){for(var t=0;t<40;t++){var k=rnd(pool),p=keyParts(k),A=QURAN[p[0]].a;if(p[1]>=A.length)continue;var na=A[p[1]];var opts=[na],seen={};seen[na]=1;var guard=0;while(opts.length<3&&guard++<80){var cand=rnd(A);if(!seen[cand]){seen[cand]=1;opts.push(cand);}}if(opts.length<3)continue;return{type:"n",s:p[0],a:p[1],prompt:ayahText(p[0],p[1]),opts:shuffle(opts),ans:na};}return null;}
function mkOrder(pool){for(var t=0;t<40;t++){var n=+rnd(ORDER),A=QURAN[n].a;if(A.length<3)continue;var st=1+Math.floor(Math.random()*(A.length-2));var seq=[A[st-1],A[st],A[st+1]];return{type:"o",s:n,a:st,seq:seq,shown:shuffle([0,1,2]),picked:[]};}return null;}
App.startQuiz=function(){var pool=poolKeys(),qs=[],types=shuffle(["c","n","o","c","n"]);for(var i=0;i<5;i++){var q=null;if(types[i]==="c")q=mkComplete(pool);else if(types[i]==="n")q=mkNext(pool);else q=mkOrder(pool);if(!q)q=mkComplete(pool)||mkNext(pool)||mkOrder(pool);if(q)qs.push(q);}Q={qs:qs,i:0,ok:0,no:0,lock:false,prog:[]};render();};
App.answer=function(idx){if(!Q||Q.lock)return;var q=Q.qs[Q.i];Q.lock=true;var good=q.opts[idx]===q.ans;if(good){Q.ok++;}else{Q.no++;addFail(q.s,q.a);}save();Q.prog.push(good);render();};
App.orderTap=function(pos){if(!Q||Q.lock)return;var q=Q.qs[Q.i];if(!q.picked)q.picked=[];if(q.picked.indexOf(pos)>=0)return;q.picked.push(pos);if(q.picked.length===3){Q.lock=true;var good=q.picked.map(function(p){return q.shown[p];}).join(",")==="0,1,2";if(good){Q.ok++;}else{Q.no++;addFail(q.s,q.a);}save();Q.prog.push(good);}render();};
App.nextQ=function(){if(!Q)return;Q.i++;Q.lock=false;if(Q.i>=Q.qs.length){var sc=Math.round(Q.ok/Q.qs.length*100);if(sc>S.best){S.best=sc;save();}}render();};
function addFail(s,a){var k=key(s,a),f=S.rev.filter(function(r){return r.k===k;})[0];if(f){f.fails++;f.due=todayStr(0);}else{S.rev.push({k:k,added:todayStr(0),due:todayStr(0),fails:1});}}
function vQuiz(){
  if(!Q)return '<div class="card center"><h2>🧠 اختبر حفظي</h2><p class="muted">5 أسئلة متنوعة: أكمل الآية، اختر التالية، ورتّب الآيات.<br>الأخطاء تُضاف تلقائياً لقائمة المراجعة.</p><button class="btn btn-primary" onclick="App.startQuiz()">ابدأ الاختبار 🚀</button></div>';
  if(Q.i>=Q.qs.length){var sc=Math.round(Q.ok/Q.qs.length*100);var off=(339.3*(1-sc/100)).toFixed(1);return '<div class="card center"><h2>🎉 نتيجة الاختبار</h2><div class="score-wrap"><svg class="score-ring" width="150" height="150" viewBox="0 0 130 130"><defs><linearGradient id="goldgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D5BC4"/><stop offset="1" stop-color="#B7A6F5"/></linearGradient></defs><circle class="bg" cx="65" cy="65" r="54" fill="none" stroke-width="12"/><circle class="fg" cx="65" cy="65" r="54" fill="none" stroke-width="12" stroke-dasharray="339.3" stroke-dashoffset="'+off+'"/><text x="65" y="64" text-anchor="middle" class="score-num">'+sc+'%</text><text x="65" y="86" text-anchor="middle" class="score-lbl">درجتك</text></svg></div><div class="stats3"><div class="stat"><b>'+Q.ok+'</b><span>صحيحة ✅</span></div><div class="stat"><b>'+Q.no+'</b><span>خاطئة ❌</span></div><div class="stat"><b>'+S.best+'%</b><span>أفضل درجة</span></div></div><p>'+(sc>=80?"ممتاز! حفظ متقن 🌿":sc>=60?"جيد! راجع الأخطاء وواصل 🌿":"لا بأس! المراجعة تصنع الإتقان 🌿")+'</p><button class="btn btn-primary" onclick="App.startQuiz()">إعادة الاختبار 🔁</button><button class="btn btn-ghost" onclick="App.go(\'home\')">العودة للرئيسية 🏠</button></div>';}
  var q=Q.qs[Q.i],h='<div class="card"><div class="muted">سؤال '+(Q.i+1)+' من '+Q.qs.length+'</div><div class="pbar"><div style="width:'+Math.round(Q.i/Q.qs.length*100)+'%"></div></div>';
  if(q.type==="c"){h+='<h2>📝 أكمل الآية</h2><div class="ayah"><span class="txt">'+q.prompt+' …</span> <span class="ref">'+sName(q.s)+" "+q.a+'</span></div>';q.opts.forEach(function(o,i){var cls="opt";if(Q.lock){cls+=" locked";if(o===q.ans)cls+=" correct";}h+='<div class="'+cls+'" onclick="App.answer('+i+')">'+o+'</div>';});}
  else if(q.type==="n"){h+='<h2>🔗 ما الآية التالية؟</h2><div class="ayah"><span class="txt">'+q.prompt+'</span> <span class="ref">'+sName(q.s)+" "+q.a+'</span></div>';q.opts.forEach(function(o,i){var cls="opt";if(Q.lock){cls+=" locked";if(o===q.ans)cls+=" correct";}h+='<div class="'+cls+'" onclick="App.answer('+i+')">'+o+'</div>';});}
  else{if(!q.picked)q.picked=[];h+='<h2>🔢 رتب الآيات بالترتيب الصحيح</h2><div class="muted">اضغط الآيات بالترتيب (1 ثم 2 ثم 3) — '+sName(q.s)+'</div>';q.shown.forEach(function(si){var dis=Q.lock||q.picked.indexOf(si)>=0;var cls="opt"+(dis?" locked":"");var mark=q.picked.indexOf(si)>=0?" ("+(q.picked.indexOf(si)+1)+")":"";h+='<div class="'+cls+'" onclick="App.orderTap('+si+')">'+q.seq[si]+mark+'</div>';});}
  if(Q.lock){var last=Q.prog[Q.prog.length-1];h+=last?'<div class="feedback good">أحسنت! 🌿</div>':'<div class="feedback bad">إجابة تحتاج مراجعة 💛<br>الصحيح: <span style="font-family:Amiri,serif">'+(q.type==="o"?q.seq.join(" / "):q.ans)+'</span></div>';h+='<button class="btn btn-primary" onclick="App.nextQ()">'+(Q.i+1>=Q.qs.length?"عرض النتيجة 🏁":"السؤال التالي ⬅️")+'</button>';}
  return h+'</div>';
}
/* ---------- REVIEW ---------- */
App.reviewed=function(k){S.rev=S.rev.filter(function(r){return r.k!==k;});S.reviews++;save();render();};
App.revToggle=function(k){var el=document.getElementById("rv"+k.replace(":","_"));if(el)el.classList.toggle("hidden-ayah");};
function revItem(r){var p=keyParts(r.k);return '<div class="ayah" id="rv'+p[0]+"_"+p[1]+'"><span class="txt">'+ayahText(p[0],p[1])+'</span> <span class="ref">'+ref(p[0],p[1])+'</span><div class="abtns"><button onclick="App.revToggle(\''+r.k+'\')">إخفاء/إظهار 🙈</button><button class="ok" onclick="App.reviewed(\''+r.k+'\')">تمت المراجعة ✓</button></div></div>';}
function vReview(){
  var t=todayStr(0),att=[],tdy=[],wk=[];
  S.rev.forEach(function(r){var age=ageDays(r.added);if(r.fails>=2||age>7)att.push(r);else if(r.due<=t)tdy.push(r);else wk.push(r);});
  var h='<div class="card"><h2>🔄 مراجعتي ('+S.rev.length+')</h2><div class="muted">راجع ثم اضغط «تمت المراجعة ✓» لتخرج الآية من القائمة.</div></div>';
  h+='<div class="section-t">⭐ آيات تحتاج إلى اهتمام ('+att.length+')</div>';h+=att.length?att.map(revItem).join(""):'<div class="empty">لا شيء هنا 🎉</div>';
  h+='<div class="section-t">📌 مراجعة اليوم ('+tdy.length+')</div>';h+=tdy.length?tdy.map(revItem).join(""):'<div class="empty">لا شيء اليوم 🎉</div>';
  h+='<div class="section-t">🗓️ مراجعة هذا الأسبوع ('+wk.length+')</div>';h+=wk.length?wk.map(revItem).join(""):'<div class="empty">القائمة فارغة 🎉</div>';
  return h;
}
/* ---------- ACHIEVEMENTS ---------- */
App.resetAll=function(){if(!confirm("تصفير جميع البيانات والعودة للبيانات التجريبية؟"))return;try{localStorage.removeItem("rafeeq-v1");}catch(e){}S=seedState();save();H={s:null,from:1,to:5,hide:{}};Q=null;render();};
function vAchv(){
  var done=surahsDone(),mc=memCount(),jc=juzCount(),st=streak(),pct=corpusPct();
  function badge(em,t,ok,hint){return '<div class="badge '+(ok?"earned":"locked")+'"><div class="em">'+em+'</div><b>'+t+'</b><small>'+(ok?"تم! 🎉":hint)+'</small></div>';}
  var h='<div class="card"><h2>🏆 إنجازاتي</h2><div class="stats3"><div class="stat"><b>'+done.length+'</b><span>سور محفوظة</span></div><div class="stat"><b>'+jc+'</b><span>أجزاء مكتملة</span></div><div class="stat"><b>'+mc+'</b><span>آية محفوظة</span></div></div><div class="stats3"><div class="stat"><b>'+S.maxStreak+'</b><span>أطول سلسلة</span></div><div class="stat"><b>'+pct+'%</b><span>إكمال المنهج</span></div><div class="stat"><b>'+S.reviews+'</b><span>مراجعات منجزة</span></div></div>';
  var j30=0;for(var n=78;n<=114;n++){var A=QURAN[n].a,c=0;for(var i=0;i<A.length;i++)if(isMem(n,i+1))c++;j30+=c;}
  h+='<div class="muted">جزء عم: '+j30+' / 564 آية</div><div class="pbar"><div style="width:'+Math.round(j30/564*100)+'%"></div></div></div>';
  h+='<div class="card"><h2>🎖️ الشارات</h2><div class="badge-grid">';
  h+=badge("🏆","أول سورة",done.length>=1,"احفظ سورة كاملة");
  h+=badge("🌱","7 أيام متتالية",S.maxStreak>=7,"واصل "+(7-S.maxStreak)+" أيام");
  h+=badge("⭐","10 سور",done.length>=10,"احفظ "+(10-done.length)+" سور");
  h+=badge("📖","أول جزء",jc>=1,"أكمل جزء عم");
  h+='</div><div class="muted center">السور المحفوظة: '+(done.length?done.map(function(n){return sName(n);}).join("، "):"—")+'</div>';
  h+='<button class="btn btn-ghost" onclick="App.resetAll()">إعادة تعيين البيانات ↺</button></div>';
  return h;
}
/* ---------- PLAN ---------- */
App.savePlan=function(){
  var mode=document.querySelector('input[name="pmode"]:checked').value;
  var v=+document.getElementById("pval").value||5;
  if(v<1)v=1;if(mode==="d"&&v>50)v=50;if(mode==="w"&&v>20)v=20;
  S.plan={mode:mode,val:v};S.goal=mode==="d"?v:Math.max(1,Math.round(v*10/7));save();render();
};
App.startSuggested=function(){var n=S.plan?planNext().s:firstUnmemSurah();var un=nextUnmem(n,S.goal||5);pendingRange={s:n,from:un.length?un[0]:1,to:un.length?un[un.length-1]:1};App.go("hifz");};
function planNext(){var rem=[];for(var i=0;i<ORDER.length;i++){var n=ORDER[i],un=nextUnmem(n,1);if(un.length)return{s:n,from:un[0]};}return{s:ORDER[0],from:1};}
function vPlan(){
  var mc=memCount(),rem=TOTAL_AYAT-mc;
  var h='<div class="card"><h2>🗓️ خطتي للحفظ</h2><div class="muted">المنهج: الفاتحة + جزء عم ('+TOTAL_AYAT+' آية) • المتبقي: <b>'+rem+'</b> آية</div>';
  h+='<label><input type="radio" name="pmode" value="d"'+((!S.plan||S.plan.mode==="d")?" checked":"")+'> آيات يومياً</label> ';
  h+='<label><input type="radio" name="pmode" value="w"'+((S.plan&&S.plan.mode==="w")?" checked":"")+'> صفحات أسبوعياً (تقدير: الصفحة ≈ 10 آيات)</label>';
  h+='<input type="number" id="pval" min="1" value="'+(S.plan?S.plan.val:5)+'"><button class="btn btn-primary" onclick="App.savePlan()">احفظ الخطة 💾</button></div>';
  if(S.plan&&rem>0){
    var perDay=S.plan.mode==="d"?S.plan.val:Math.max(1,Math.round(S.plan.val*10/7));
    var days=Math.ceil(rem/perDay),dt=new Date();dt.setDate(dt.getDate()+days);
    var nx=planNext(),un=nextUnmem(nx.s,perDay);
    h+='<div class="card gold"><h2>📋 خطتك الحالية</h2><div>الوتيرة: <b>'+(S.plan.mode==="d"?S.plan.val+" آيات يومياً":S.plan.val+" صفحات أسبوعياً (≈ "+perDay+" آيات يومياً)")+'</b></div><div>المدة المتوقعة: <b>'+days+' يوم</b> • الإتمام المتوقع: <b>'+dt.getFullYear()+"/"+(dt.getMonth()+1)+"/"+dt.getDate()+'</b></div><div class="muted">اقتراح اليوم: '+sName(nx.s)+' آيات '+un[0]+"–"+un[un.length-1]+'</div><button class="btn btn-primary" onclick="App.startSuggested()">ابدأ حفظ اليوم 🚀</button></div>';
  } else if(rem===0){h+='<div class="card gold center"><h2>🎉 ما شاء الله! أتممت المنهج كاملاً</h2></div>';}
  return h;
}
render();
</script>
